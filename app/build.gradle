plugins {
    id 'com.android.application'
}

// Huawei Ads (Petal) slot IDs for the AppGallery (hms) build; override with -PHMS_BANNER_ID=... or a
// gitignored ads.properties. Debug builds always use Huawei's public test slots.
def adsProps = new Properties()
def adsFile = rootProject.file('ads.properties')
if (adsFile.exists()) adsFile.withInputStream { adsProps.load(it) }
def adId = { String key, String fallback -> ((project.findProperty(key) ?: adsProps.getProperty(key))?.toString()?.trim()) ?: fallback }
def HMS_TEST_BANNER_ID = 'testw6vs28auh3'
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_BANNER_ID = adId('HMS_BANNER_ID', 'b93ymr693k')
def HMS_INTERSTITIAL_ID = adId('HMS_INTERSTITIAL_ID', 'q0uckdqu9k')

android {
    namespace 'com.bumbumapps.fifteenpuzzlepro'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bumbumapps.fifteenpuzzlepro'
        versionCode 5
        versionName "1.1.0"
        minSdk 24
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }



    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    // play = Google Play (no ads), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_banner_id', HMS_BANNER_ID
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_banner_id', HMS_TEST_BANNER_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
        }
    }

    buildFeatures {
        resValues true
        buildConfig true
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation 'androidx.core:core:1.17.0'
    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}
